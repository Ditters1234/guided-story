<rect x="1020" y="115" width="435" height="150" rx="13" fill="#d5e5cf" stroke="#849a7b" stroke-width="2"/><text x="1040" y="145" font-size="19" fill="#243d35">CREEK LOOP TRAIL</text><text x="1040" y="175" font-size="15" fill="#243d35">Willow shade · creek crossing</text><text x="1040" y="198" font-size="15" fill="#243d35">Quiet riding route back to the horse yard</text>
