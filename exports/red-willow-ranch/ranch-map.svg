<rect x="1020" y="700" width="435" height="307" rx="13" fill="#e4eaf1" stroke="#849a7b" stroke-width="2"/><text x="1040" y="730" font-size="19" fill="#243d35">HOW THE RECORDS FIT</text><text x="1040" y="760" font-size="15" fill="#243d35">Places nest inside places.</text><text x="1040" y="783" font-size="15" fill="#243d35">Tractor moves; cab and attached bin follow.</text><text x="1040" y="806" font-size="15" fill="#243d35">Items sit with a person, place or container.</text><text x="1040" y="829" font-size="15" fill="#243d35">Horses and cows use cast location records.</text><text x="1040" y="852" font-size="15" fill="#243d35">Feed stacks count whole scoops / flakes.</text><text x="1040" y="875" font-size="15" fill="#243d35">No reference images are required.</text>
<text x="47" y="1055" font-size="18" fill="#243d35">Feed path: Grain Hopper → Tractor Feed Bin → Cattle Feed Trough → consumption only when eaten.</text><text x="47" y="1092" font-size="16" fill="#243d35">This map shows the starting state. Travel, handovers, loading and completed chores change canon during play.</text>
