<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a45a2a" stroke-width="1.5"/></marker></defs><rect width="1500" height="1150" fill="#eff2e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="48" font-size="30" fill="#243d35">RED WILLOW RANCH</text><text x="47" y="82" font-size="17" fill="#243d35">Starting layout · schematic, not to scale · north is up</text>
<rect x="45" y="115" width="480" height="150" rx="13" fill="#dce8c8" stroke="#849a7b" stroke-width="2"/><text x="65" y="145" font-size="19" fill="#243d35">NORTH PASTURE</text><text x="65" y="175" font-size="15" fill="#243d35">12 cows · feed trough initially empty</text><text x="65" y="198" font-size="15" fill="#243d35">Water trough · secure gate with a sticky latch</text><text x="65" y="221" font-size="15" fill="#243d35">The tractor can park here after the feeding round.</text>
